<section class="admin-section">
  <h3>👥 Familienmitglieder</h3>

  @if (selectedUser; as user) {
    <section class="selected-member-panel">
      <div class="selected-member-heading">
        <div>
          <h4>{{ user.name }}</h4>
          <span>{{ roleLabel(user.role) }}</span>
        </div>
      </div>
      @defer (when selectedUserId === user.id) {
        <app-member-details
          [user]="user"
          (editorActionsChange)="onMemberActionsChanged($event)">
        </app-member-details>
      } @placeholder {
        <p>Mitgliedseinstellungen werden geladen …</p>
      }
    </section>
  } @else {
    <div class="inline-create-card">
      <h4>Neues Familienmitglied hinzufügen</h4>
      <form class="input-row" (ngSubmit)="$event.preventDefault()">
        <input type="text" [(ngModel)]="createUserName" (ngModelChange)="publishEditorActions()" name="createUserName" placeholder="Name eintragen..." aria-label="Name des neuen Mitglieds">
        <select [(ngModel)]="createUserGroup" (ngModelChange)="publishEditorActions()" name="createUserGroup" aria-label="Gruppe">
          <option value="adult">Erwachsene</option>
          <option value="child">Kinder</option>
        </select>
      </form>
    </div>
  }
  <p class="error-message" role="alert" [hidden]="!userActionError">{{ userActionError }}</p>
</section>
