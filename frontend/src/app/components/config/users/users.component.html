<section class="admin-section">
  <h3>👥 Familienmitglieder</h3>

  @if (selectedUser; as user) {
    <section class="selected-member-panel">
      <div class="selected-member-heading">
        <div>
          <h4>{{ user.name }}</h4>
          <span>{{ roleLabel(user.role) }}</span>
        </div>
        <button type="button" class="btn-delete" (click)="deleteUser(user.id)">Löschen</button>
      </div>
      @defer (when selectedUserId === user.id) {
        <app-member-details [user]="user" (close)="memberClosed.emit()"></app-member-details>
      } @placeholder {
        <p>Mitgliedseinstellungen werden geladen …</p>
      }
    </section>
  } @else {
    <div class="inline-create-card">
      <h4>Neues Familienmitglied hinzufügen</h4>
      <div class="input-row">
        <input type="text" [(ngModel)]="createUserName" placeholder="Name eintragen..." aria-label="Name des neuen Mitglieds">
        <select [(ngModel)]="createUserGroup" aria-label="Gruppe">
          <option value="adult">Erwachsene</option>
          <option value="child">Kinder</option>
        </select>
        <button type="button" class="btn-action-add" (click)="submitNewUser()">Hinzufügen</button>
      </div>
    </div>
  }
</section>
