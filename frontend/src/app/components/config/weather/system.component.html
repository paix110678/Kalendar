<div class="admin-section">
  <h3>🌤️ Wetter &amp; Standort konfigurieren</h3>
  <div class="location-actions" *ngIf="selectedLocationId === null">
    <button type="button" class="btn-save-config-submit" (click)="startCreatingLocation()">＋ Standort hinzufügen</button>
  </div>
  <p *ngIf="loading" role="status">Standort wird geladen …</p>

  <div class="inline-create-card" *ngIf="!loading && (editingLocationId !== null || creatingLocation)">
    <h4>{{ creatingLocation ? 'Neuen Standort anlegen' : locationForm.name }}</h4>
    <div class="form-grid-config">
      <div class="field-item">
        <label for="weather-location-name">Standortname:</label>
        <input id="weather-location-name" type="text" [(ngModel)]="locationForm.name" (ngModelChange)="publishEditorActions()" maxlength="100">
      </div>
      <div class="field-item">
        <label for="weather-location-plz">Postleitzahl (PLZ):</label>
        <input id="weather-location-plz" type="text" [(ngModel)]="locationForm.weather_plz" (ngModelChange)="publishEditorActions()" maxlength="20">
      </div>
      <div class="field-item">
        <label>Erkannter Ort:</label>
        <input type="text" [value]="locationForm.weather_city || 'Noch nicht ermittelt'" readonly>
      </div>
      <div class="field-item">
        <label>Gespeicherte Koordinaten:</label>
        <input
          type="text"
          [value]="locationForm.weather_latitude !== null && locationForm.weather_longitude !== null
            ? locationForm.weather_latitude + ', ' + locationForm.weather_longitude
            : 'Noch nicht ermittelt'"
          readonly>
      </div>
      <div class="field-item">
        <label for="weather-location-service">Wetterdienst (API):</label>
        <select id="weather-location-service" [(ngModel)]="locationForm.weather_service" (ngModelChange)="publishEditorActions()">
          <option value="open_meteo">🌦️ Open-Meteo (Kostenlos)</option>
          <option value="weather_api">🌀 WeatherAPI (Schlüssel benötigt)</option>
        </select>
      </div>
      <div class="field-item" *ngIf="locationForm.weather_service === 'weather_api'">
        <label for="weather-location-api-key">WeatherAPI Key:</label>
        <input id="weather-location-api-key" type="password" [(ngModel)]="locationForm.api_key" (ngModelChange)="publishEditorActions()">
      </div>
    </div>
    <p *ngIf="locationForm.is_active" role="status">Aktiver Standort für die Wetteranzeige</p>
    <div class="location-actions">
      <button *ngIf="!creatingLocation && !locationForm.is_active" class="btn-save-config-submit" (click)="triggerAction('activate')">Als Wetter-Standort verwenden</button>
    </div>
  </div>
</div>
