<div class="admin-section">
  <h3>{{ selectedCategoryId === null ? '🏷️ Kategorie hinzufügen' : '🏷️ Kategorie bearbeiten' }}</h3>
  <div class="inline-edit-form">
    <label>
      <span>Name</span>
      <input type="text" [(ngModel)]="tempCatLabel" (ngModelChange)="publishEditorActions()" maxlength="100">
    </label>
    <label>
      <span>Kürzel</span>
      <input class="category-shortcut-input" type="text" [(ngModel)]="tempCatShort" (ngModelChange)="publishEditorActions()" maxlength="10">
    </label>
    <label>
      <span>Farbe</span>
      <app-color-picker [value]="tempCatColor" (valueChange)="tempCatColor = $event; publishEditorActions()"></app-color-picker>
    </label>
  </div>
</div>
