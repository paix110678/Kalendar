<details class="color-picker">
  <summary [attr.aria-label]="'Farbe auswählen, aktuell ' + value">
    <span class="current-color" [style.background-color]="value" aria-hidden="true"></span>
    <span>{{ value }}</span>
  </summary>
  <div class="palette-panel" role="group" aria-label="Farbpalette">
    <div class="palette-tabs" role="group" aria-label="Farbauswahl">
      <button
        type="button"
        [attr.aria-pressed]="activeTab === 'standard'"
        [class.palette-tab-active]="activeTab === 'standard'"
        (click)="setActiveTab('standard')">
        Standard
      </button>
      <button
        type="button"
        [attr.aria-pressed]="activeTab === 'created'"
        [class.palette-tab-active]="activeTab === 'created'"
        (click)="setActiveTab('created')">
        Eigene
      </button>
      <button
        type="button"
        (click)="openCustomPalette(customColorInput)">
        Custom
      </button>
      <button
        type="button"
        class="palette-close"
        aria-label="Farbpalette schließen"
        title="Schließen"
        (click)="closePalette($event)">
        ×
      </button>
      <input
        #customColorInput
        class="native-color-input"
        type="color"
        [value]="value"
        (change)="onPaletteChange($event)"
        aria-label="Eigene Farbe auswählen">
    </div>
    @if (activeTab === 'standard') {
      <div class="standard-colors" role="tabpanel" aria-label="Standardfarben">
        @for (color of standardColors; track color.value) {
          <button
            type="button"
            class="standard-color"
            [style.background-color]="color.value"
            [class.standard-color-selected]="value.toLowerCase() === color.value"
            [attr.aria-label]="color.name"
            [attr.aria-pressed]="value.toLowerCase() === color.value"
            [title]="color.name"
            (click)="selectStandardColor(color.value, $event)">
          </button>
        }
      </div>
    } @else if (activeTab === 'created') {
      <div class="standard-colors" role="tabpanel" aria-label="Erstellte Farben">
        @for (color of createdColors; track color) {
          <button
            type="button"
            class="standard-color"
            [style.background-color]="color"
            [class.standard-color-selected]="value.toLowerCase() === color"
            [attr.aria-label]="'Erstellte Farbe ' + color"
            [attr.aria-pressed]="value.toLowerCase() === color"
            [title]="color"
            (click)="selectStandardColor(color, $event)">
          </button>
        } @empty {
          <span class="empty-colors">Noch keine eigenen Farben erstellt</span>
        }
      </div>
    }
  </div>
</details>
