<div class="top-bar-grid-container">
  <div *ngIf="isCapturingScreenshot" class="screenshot-capture-overlay" role="status" aria-live="polite">
    <span class="screenshot-spinner" aria-hidden="true"></span>
    <span>Screenshot wird erstellt …</span>
  </div>
  
  <!-- ETAGE 1 (Oben links): Das Logo sitzt jetzt geschützt und weiß auf dem farbigen Hintergrund! -->
  <div class="header-logo-row">
    <app-logo></app-logo>
    <div class="header-actions">
      <button class="btn-error-report" (click)="openErrorReport()" title="Fehler melden" aria-label="Fehler melden" [disabled]="isCapturingScreenshot">
        <span aria-hidden="true">🐞</span>
      </button>
      <button class="btn-admin-gear" (click)="adminPageOpened.emit()" title="Administration / Einstellungen" aria-label="Einstellungen">⚙️</button>
    </div>
  </div>

  <!-- ETAGE 2 (Direkt darunter): Alle Controls perfekt aufgereiht innerhalb derselben Kapsel -->
  <div class="controls-row">
    <!-- Symmetrische Ansichts-Buttons in der Mitte -->
    <app-view-mode-buttons 
      [currentViewMode]="currentViewMode" 
      (viewModeChanged)="viewModeChanged.emit($event)">
    </app-view-mode-buttons>

    <!-- Profilleiste mit Drag-and-Drop -->
    <app-user-selector 
      [activeUsers]="activeUsers"
      (userVisibilityToggled)="userVisibilityToggled.emit($event)"
      (rewardDashboardOpened)="rewardDashboardOpened.emit($event)">
    </app-user-selector>

    <!-- Live-Wetteranzeige ganz rechts -->
    <app-weather-widget [config]="{
      live_temp: sysConfig?.live_temp || '--',
      high_temp: sysConfig?.high_temp || '--',
      low_temp: sysConfig?.low_temp || '--',
      live_rain: sysConfig?.live_rain || '--',
      weather_city: sysConfig?.weather_city || 'Bremen'
    }"></app-weather-widget>
  </div>

</div>

<app-error-report-dialog
  *ngIf="showErrorReport"
  [screenshotDataUrl]="screenshotDataUrl"
  [screenshotError]="screenshotError"
  (closed)="showErrorReport = false">
</app-error-report-dialog>
