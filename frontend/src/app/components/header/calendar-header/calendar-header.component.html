<div class="top-bar-grid-container">
  <app-header-brand
    [isCapturingScreenshot]="isCapturingScreenshot"
    (adminPageOpened)="adminPageOpened.emit()"
    (errorReportRequested)="errorReportRequested.emit()">
  </app-header-brand>

  <div class="header-bottom-row">
    @if (headerTitle) {
      <app-title-back-header [title]="headerTitle" (back)="headerBack.emit()"></app-title-back-header>
    } @else if (showControls) {
      <app-header-controls
        [activeUsers]="activeUsers"
        [currentViewMode]="currentViewMode"
        [config]="sysConfig"
        [preferences]="headerPreferences"
        (viewModeChanged)="viewModeChanged.emit($event)"
        (userVisibilityToggled)="userVisibilityToggled.emit($event)"
        (rewardDashboardOpened)="rewardDashboardOpened.emit($event)">
      </app-header-controls>
    }
  </div>
</div>
