<div class="account-actions">
  <div class="action-row">
    @if (authService.currentAccount; as account) {
      <div class="account-profile-trigger">
        <button
          type="button"
          class="account-avatar"
          [style.background-color]="accountColor"
          [attr.aria-expanded]="accountProfileOpen"
          aria-haspopup="dialog"
          aria-controls="account-profile-view"
          aria-label="Kontodetails für {{ account.display_name }}"
          (click)="accountProfileToggled.emit()">
          {{ accountInitials }}
        </button>
      </div>
    }

    <button
      type="button"
      class="icon-action btn-error-report"
      (click)="errorReportRequested.emit()"
      title="Fehler melden"
      aria-label="Fehler melden"
      [disabled]="isCapturingScreenshot">
      <span aria-hidden="true">🐞</span>
    </button>

    @if (canOpenAdmin) {
      <button
        type="button"
        class="icon-action btn-admin-gear"
        (click)="adminPageOpened.emit()"
        title="Administration / Einstellungen"
        aria-label="Einstellungen">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10.5 2h3l.55 2.2a8 8 0 0 1 1.6.66l2.05-1.02 2.12 2.12-1.02 2.05a8 8 0 0 1 .66 1.6l2.04.55v3l-2.04.55a8 8 0 0 1-.66 1.6l1.02 2.05-2.12 2.12-2.05-1.02a8 8 0 0 1-1.6.66L13.5 22h-3l-.55-2.04a8 8 0 0 1-1.6-.66L6.3 20.32l-2.12-2.12 1.02-2.05a8 8 0 0 1-.66-1.6L2.5 14v-3l2.04-.55a8 8 0 0 1 .66-1.6L4.18 6.8 6.3 4.68l2.05 1.02a8 8 0 0 1 1.6-.66L10.5 2Z" />
          <circle cx="12" cy="12" r="3.25" />
        </svg>
      </button>
    }
  </div>

  <span class="app-version" [title]="'Version ' + version">v{{ version }}</span>
</div>
