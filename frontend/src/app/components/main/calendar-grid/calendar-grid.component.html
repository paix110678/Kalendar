<div class="calendar-main-layout-wrapper">

  <!-- Feste Sidebar links für den Editor -->
  @if (showBlockEditor) {
    <div class="calendar-sidebar-editor-container">
      <app-block-editor 
        [selectedUser]="selectedUser"
        [activeUsers]="getVisibleUsers()"
        [editingBlockId]="currentEditingBlockId"
        (blockSaved)="onEditorSuccess()"
        (closeEditor)="onEditorCancel()">
      </app-block-editor>
    </div>
  }

  <!-- Der neue Grid-Kalender verwendet weiterhin die bestehenden Backend-Zeitblöcke. -->
  <div class="calendar-scroll-viewport">
    <glc-grid-calendar
      style="display: block; width: 100%; height: 100%;"
      [events]="calendarEvents"
      contentMode="grid"
      [resources]="calendarResources"
      [viewMode]="calendarViewMode"
      columnMode="resource"
      [anchorDate]="anchorDate"
      [config]="calendarConfig"
      [theme]="calendarTheme"
      (eventsChange)="onCalendarEventsChange($event)"
      (eventCreateRequested)="onCalendarEventCreated($event)"
      (eventClicked)="onCalendarEventClicked($event)"
      (eventEditRequested)="onCalendarEventEdited($event)"
      (eventMoved)="onCalendarEventMoved($event)"
      (eventUpdated)="onCalendarEventUpdated($event)"
      (eventDeleted)="onCalendarEventDeleted($event)">
    </glc-grid-calendar>
  </div> <!-- /calendar-scroll-viewport -->

</div>
