<div class="app-layout">
  
  <div class="dashboard-center-column">
    
    <!-- Die Shell reicht die Events sauber an den Header und das Gitter weiter -->
    <app-calendar-header 
      class="dashboard-frame-capsule"
      [activeUsers]="calendarGrid.activeUsersSignal()"
      [currentViewMode]="calendarGrid.currentViewMode"
      (viewModeChanged)="calendarGrid.changeViewMode($event)"
      (userVisibilityToggled)="calendarGrid.toggleUserVisibility($event.userId, $event.event)"
      (rewardDashboardOpened)="calendarGrid.openRewardDashboardForUser($event)"
      (adminPageOpened)="showAdminPage = true">
    </app-calendar-header>

    <!-- Der Hauptkalender mit der identischen Kapsel-Klasse -->
    <div class="main-content dashboard-frame-capsule" [style.display]="showAdminPage || calendarGrid.showRewardPage ? 'none' : 'flex'">
      <app-calendar-grid #calendarGrid></app-calendar-grid>
    </div>

  </div>

  <!-- Externe Modale -->
  <app-admin-dashboard *ngIf="showAdminPage" [activeUsers]="calendarGrid.activeUsersSignal()" [activeRewards]="calendarGrid.activeRewardsSignal()" [selectedUser]="calendarGrid.selectedUser" (closeAdmin)="showAdminPage = false"></app-admin-dashboard>
  <app-reward-dashboard *ngIf="calendarGrid.showRewardPage" [user]="calendarGrid.selectedUser" [activeRewards]="calendarGrid.activeRewardsSignal()" (closeDashboard)="calendarGrid.showRewardPage = false"></app-reward-dashboard>
</div>
