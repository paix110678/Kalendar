<div class="calendar-app-shell" style="display: flex; flex-direction: column; height: 100vh; overflow: hidden;">
  
  <!-- KOPFZEILE MIT ALLEN ORIGINAL-EVENTS -->
  <app-calendar-header 
    [activeUsers]="calendarGrid.activeUsersSignal()"
    [currentViewMode]="calendarGrid.currentViewMode"
    (viewModeChanged)="calendarGrid.changeViewMode($event)"
    (userVisibilityToggled)="calendarGrid.toggleUserVisibility($event.userId, $event.event)"
    (rewardDashboardOpened)="calendarGrid.openRewardDashboardForUser($event)"
    (adminPageOpened)="showAdminPage = true">
  </app-calendar-header>

  <div class="main-workspace-frame" style="flex: 1; display: flex; position: relative; overflow: hidden;">
    
    <!-- DER STABILE HAUPTKALENDER -->
    <div class="grid-content-view" [style.display]="showAdminPage || calendarGrid.showRewardPage ? 'none' : 'block'" style="width: 100%; height: 100%;">
      <app-calendar-grid #calendarGrid></app-calendar-grid>
    </div>

    <!-- Das System-Dashboard -->
    <app-admin-dashboard
      *ngIf="showAdminPage"
      [activeUsers]="calendarGrid.activeUsersSignal()"
      [activeRewards]="calendarGrid.activeRewardsSignal()"
      [selectedUser]="calendarGrid.selectedUser"
      (closeAdmin)="showAdminPage = false">
    </app-admin-dashboard>

    <!-- REPARIERT: Dockt jetzt unfehlbar an die echten Schnittstellen [user] und (closeDashboard) an! -->
    <app-reward-dashboard
      *ngIf="calendarGrid.showRewardPage"
      [user]="calendarGrid.selectedUser"
      [activeRewards]="calendarGrid.activeRewardsSignal()"
      (closeDashboard)="calendarGrid.showRewardPage = false">
    </app-reward-dashboard>

  </div>
</div>
