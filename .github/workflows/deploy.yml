name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild and restart containers
        run: |
          docker-compose down
          docker-compose up -d --build
