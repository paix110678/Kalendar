services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      KALENDAR_DB_PATH: /data/kalender.db
    volumes:
      - backend-data:/data
    restart: always

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  backend-data:
