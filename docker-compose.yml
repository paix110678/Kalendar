version: "2.4"

services:
  backend:
    image: ${KALENDAR_BACKEND_IMAGE:-kalendar_backend:dev}
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      KALENDAR_DB_PATH: /data/kalender.db
      KALENDAR_AUTH_DB_PATH: /data/auth.sqlite3
      KALENDAR_TENANT_DB_DIR: /data/families
      KALENDAR_PUBLIC_URL: ${KALENDAR_PUBLIC_URL:-https://famsolver.de}
      KALENDAR_COOKIE_SECURE: ${KALENDAR_COOKIE_SECURE:-true}
      KALENDAR_CORS_ORIGINS: ${KALENDAR_CORS_ORIGINS:-https://famsolver.de}
      KALENDAR_BOOTSTRAP_TOKEN: ${KALENDAR_BOOTSTRAP_TOKEN:-}
      KALENDAR_SMTP_HOST: ${KALENDAR_SMTP_HOST:-}
      KALENDAR_SMTP_PORT: ${KALENDAR_SMTP_PORT:-587}
      KALENDAR_SMTP_USER: ${KALENDAR_SMTP_USER:-}
      KALENDAR_SMTP_PASSWORD: ${KALENDAR_SMTP_PASSWORD:-}
      KALENDAR_SMTP_FROM: ${KALENDAR_SMTP_FROM:-}
    volumes:
      - backend-data:/data
    restart: always
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    image: ${KALENDAR_FRONTEND_IMAGE:-kalendar_frontend:dev}
    build:
      context: ./frontend
      args:
        KALENDAR_VERSION: ${KALENDAR_VERSION:-dev}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  backend-data:
